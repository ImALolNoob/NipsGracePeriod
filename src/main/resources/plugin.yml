name: HardcoreGracePeriod
version: 1.0-SNAPSHOT
main: org.novato.hardcore_grace_period.Hardcore_grace_period
api-version: '26.3'
description: Configurable grace period protection for hardcore servers
authors:
  - Novato
commands:
  graceperiod:
    description: Manage the grace period event and resurrection altar
    usage: /graceperiod <start|reset|check|set|add|addall|resetplayer|revive|dead|altar>
    permission: graceperiod.admin
  altar:
    description: Show what the resurrection altar currently needs
    usage: /altar
    permission: graceperiod.altar
permissions:
  graceperiod.admin:
    description: Allows management of grace period commands
    default: op
  graceperiod.altar:
    description: Allows viewing altar status with /altar
    default: true
